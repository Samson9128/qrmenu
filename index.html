<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yummy Restaurant</title>
<style>
  body{margin:0;font-family:sans-serif;background:#fff;color:#333}
  header{background:#ff69b4;color:#fff;padding:1rem;text-align:center;position:sticky;top:0;z-index:10}
  #cat-scroll{display:flex;overflow-x:auto;gap:0.5rem;padding:0.5rem;background:#ffe0f0}
  .cat-tab{padding:0.5rem 1rem;border:none;background:#fff;border-radius:20px;cursor:pointer;white-space:nowrap}
  .cat-tab.active{background:#ff69b4;color:#fff}
  .menu-section{padding:1rem}
  .cat-section{margin-bottom:2rem}
  .cat-section-title{font-weight:bold;font-size:1.2rem;margin-bottom:0.5rem}
  .cat-section-count{font-size:0.9rem;color:#555;margin-bottom:1rem}
  .product-card{display:flex;align-items:center;gap:1rem;margin-bottom:1rem;border:1px solid #eee;padding:0.5rem;border-radius:10px}
  .prod-img-ph{font-size:2rem;width:50px;text-align:center}
  .prod-info{flex:1}
  .prod-name{font-weight:bold}
  .prod-price{font-weight:bold;color:#ff69b4}
  .prod-add{background:#ff69b4;color:#fff;border:none;padding:0.3rem 0.6rem;border-radius:5px;cursor:pointer}
  #cart-fab{position:fixed;bottom:1rem;right:1rem;background:#ff69b4;color:#fff;border:none;padding:1rem;border-radius:50%;cursor:pointer;display:none;z-index:20}
  #cart-fab.show{display:block}
  #cart-drawer-bd{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;justify-content:flex-end;opacity:0;pointer-events:none;transition:.3s}
  #cart-drawer-bd.open{opacity:1;pointer-events:auto}
  #cart-drawer{width:300px;background:#fff;height:100%;display:flex;flex-direction:column;overflow:auto;padding:1rem;position:relative}
  .cart-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem}
  .prod-qty-ctrl{display:flex;align-items:center;gap:0.3rem}
  .qty-btn{background:#ff69b4;color:#fff;border:none;padding:0.2rem 0.5rem;border-radius:5px;cursor:pointer}
  .qty-num{min-width:20px;text-align:center}
  #cart-summary{margin-top:auto;display:none}
  #cart-empty{text-align:center;color:#999;margin-top:2rem}
  #toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:0.5rem 1rem;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
  #offline-banner{display:none;background:#ffcccc;color:#900;padding:0.5rem;text-align:center}
  /* Auth drawer */
  #auth-drawer-bd{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:.3s}
  #auth-drawer-bd.open{opacity:1;pointer-events:auto}
  #auth-drawer{background:#fff;padding:1rem;border-radius:10px;width:300px}
  .auth-tabs{display:flex;gap:1rem;margin-bottom:1rem}
  .auth-tabs button{flex:1;padding:0.5rem;border:none;cursor:pointer;border-radius:5px}
  .auth-tabs button.active{background:#ff69b4;color:#fff}
  .auth-form{display:none;flex-direction:column;gap:0.5rem}
  .auth-form input{padding:0.5rem;border:1px solid #ccc;border-radius:5px}
  .auth-form button{padding:0.5rem;background:#ff69b4;color:#fff;border:none;border-radius:5px;cursor:pointer}
</style>
</head>
<body>

<header>
  <div id="brand-name">Yummy Restaurant</div>
</header>

<div id="cat-scroll"></div>
<div class="menu-section" id="menu-sections"></div>
<div id="menu-loading">Loading menu...</div>

<!-- Offline -->
<div id="offline-banner">Server unreachable: <span id="offline-server-url"></span></div>

<!-- Cart FAB -->
<button id="cart-fab" onclick="openCart()">🛒 <span id="cart-count">0</span></button>

<!-- Cart drawer -->
<div id="cart-drawer-bd" onclick="closeCart(event)">
  <div id="cart-drawer">
    <h3>Cart</h3>
    <div id="cart-items"></div>
    <div id="cart-empty">Cart is empty</div>
    <div id="cart-summary">
      Total: <span id="cart-total">$0.00</span>
      <button id="checkout-btn" onclick="startCheckout()">Checkout</button>
      <div id="email-prompt" style="display:none;">
        <input type="email" id="email-input" placeholder="Your email"/>
        <button onclick="placeOrderWithEmail()">Place Order</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Auth drawer -->
<div id="auth-drawer-bd" onclick="closeAuth(event)">
  <div id="auth-drawer">
    <div class="auth-tabs">
      <button id="tab-login" class="active" onclick="switchAuth('login')">Login</button>
      <button id="tab-register" onclick="switchAuth('register')">Register</button>
    </div>
    <div id="form-login" class="auth-form" style="display:flex">
      <input type="email" id="login-email" placeholder="Email">
      <button onclick="doLogin()">Login</button>
    </div>
    <div id="form-register" class="auth-form">
      <input type="email" id="reg-email" placeholder="Email">
      <button onclick="doRegister()">Register</button>
    </div>
  </div>
</div>

<script>
/* ── STATE ── */
let _server = "http://localhost:5000"; // Change to your server
let _products = [];
let _cart = {};
let _tableId = 1; // default table, can set via URL

/* ── HELPERS ── */
function $(id){return document.getElementById(id)}
function showToast(msg){const t=$('toast');t.innerText=msg;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2000)}
function formatPrice(v){return "$"+Number(v).toFixed(2)}

/* ── FETCH MENU ── */
async function fetchJSON(url){
  try{
    const r=await fetch(url)
    if(!r.ok) throw new Error()
    return await r.json()
  }catch(e){
    $('offline-banner').style.display='block'
    $('offline-server-url').innerText=_server
    return null
  }
}

/* ── LOAD MENU ── */
async function loadMenu(){
  const data = await fetchJSON(_server+"/menu")
  if(!data){$('menu-loading').innerText="Unable to load menu"; return}
  _products = data.products || []
  renderMenu()
}

/* ── RENDER MENU ── */
function renderMenu(){
  const sections={}
  _products.forEach(p=>{if(!sections[p.category]) sections[p.category]=[]; sections[p.category].push(p)})
  const nav=$('cat-scroll'), cont=$('menu-sections')
  nav.innerHTML=""; cont.innerHTML=""
  Object.keys(sections).forEach((cat,i)=>{
    const tab=document.createElement("button")
    tab.className="cat-tab"+(i==0?" active":"")
    tab.innerText=cat
    tab.onclick=()=>document.getElementById("cat-"+cat).scrollIntoView()
    nav.appendChild(tab)
    const sec=document.createElement("div")
    sec.className="cat-section"; sec.id="cat-"+cat
    sec.innerHTML=`<div class="cat-section-title">${cat}</div><div class="cat-section-count">${sections[cat].length} items</div>`
    sections[cat].forEach(p=>{
      const card=document.createElement("div"); card.className="product-card"
      card.innerHTML=`<div class="prod-img-ph">🍽</div><div class="prod-info"><div class="prod-name">${p.name}</div><div class="prod-desc">${p.description||""}</div><div class="prod-price">${formatPrice(p.price)}</div></div><button class="prod-add" onclick="addToCart(${p.id})">+</button>`
      sec.appendChild(card)
    })
    cont.appendChild(sec)
  })
  $('menu-loading').style.display="none"
}

/* ── CART ── */
function addToCart(id){if(!_cart[id]) _cart[id]=0; _cart[id]++; updateCartUI(); showToast("Added to cart")}
function removeFromCart(id){if(!_cart[id]) return; _cart[id]--; if(_cart[id]<=0) delete _cart[id]; updateCartUI()}
function updateCartUI(){
  const items=$('cart-items'), totalEl=$('cart-total')
  items.innerHTML=""; let total=0,count=0
  Object.keys(_cart).forEach(id=>{
    const p=_products.find(x=>x.id==id),q=_cart[id]; total+=p.price*q; count+=q
    const row=document.createElement("div"); row.className="cart-item"
    row.innerHTML=`<div class="cart-item-name">${p.name}</div><div class="prod-qty-ctrl"><button class="qty-btn" onclick="removeFromCart(${id})">-</button><div class="qty-num">${q}</div><button class="qty-btn" onclick="addToCart(${id})">+</button></div><div class="cart-item-price">${formatPrice(p.price*q)}</div>`
    items.appendChild(row)
  })
  $('cart-count').innerText=count; totalEl.innerText=formatPrice(total)
  if(count>0){$('cart-fab').classList.add("show"); $('cart-summary').style.display="block"; $('cart-empty').style.display="none"}else{$('cart-fab').classList.remove("show"); $('cart-summary').style.display="none"; $('cart-empty').style.display="block"}
}
function openCart(){ $('cart-drawer-bd').classList.add("open") }
function closeCart(e){ if(e.target.id==='cart-drawer-bd') $('cart-drawer-bd').classList.remove("open") }

/* ── CHECKOUT ── */
function startCheckout(){ $('checkout-btn').style.display="none"; $('email-prompt').style.display="block" }
function placeOrderWithEmail(){ const email=$('email-input').value; placeOrder(email) }
async function placeOrder(email){ const items=[]; Object.keys(_cart).forEach(id=>{items.push({id:Number(id),qty:_cart[id]})}); const payload={table:_tableId,items,email}; try{await fetch(_server+"/order",{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})}catch(e){} _cart={}; updateCartUI(); $('cart-drawer-bd').classList.remove("open"); showToast("Order placed!") }

/* ── AUTH UI ── */
let _user=null
function openAuth(){ $('auth-drawer-bd').classList.add("open") }
function closeAuth(e){ if(e.target.id==='auth-drawer-bd') $('auth-drawer-bd').classList.remove("open") }
function switchAuth(type){ $('form-login').style.display= type==="login" ? "flex":"none"; $('form-register').style.display= type==="register" ? "flex":"none"; $('tab-login').classList.toggle("active",type==="login"); $('tab-register').classList.toggle("active",type==="register")}
function doLogin(){_user={email:$('login-email').value};$('auth-drawer-bd').classList.remove("open");showToast("Logged in")}
function doRegister(){_user={email:$('reg-email').value};$('auth-drawer-bd').classList.remove("open");showToast("Account created")}

/* ── INIT ── */
window.onload=()=>{
  const urlParams = new URLSearchParams(window.location.search)
  if(urlParams.has("table")) _tableId = urlParams.get("table")
  loadMenu()
}
</script>

</body>
</html>
