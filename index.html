<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#faf8f3;--surface:#fff;--card:#fff;
  --accent:#b8863a;--accent-dk:#8c6420;--accent-lt:rgba(184,134,58,.1);
  --text:#1a140a;--dim:#6b5d4f;--muted:#b0a090;
  --border:#ede6da;--radius:14px;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --nav-h:58px;--cat-h:46px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100dvh;
     padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button{cursor:pointer;font-family:var(--sans);border:none;background:none}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:3px}

#topbar{
  position:sticky;top:0;z-index:200;
  background:rgba(250,248,243,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:0 16px;height:var(--nav-h);
}
.brand{flex:1;min-width:0}
.brand-name{font-family:var(--serif);font-size:17px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.brand-tag{font-size:10.5px;color:var(--dim);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.table-badge{
  flex-shrink:0;background:var(--accent-lt);border:1px solid rgba(184,134,58,.3);
  color:var(--accent-dk);padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:600;
}
.user-btn{
  flex-shrink:0;width:36px;height:36px;border-radius:50%;
  background:var(--accent-lt);border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;transition:.18s;
}
.user-btn svg{width:17px;height:17px;stroke:var(--accent-dk);fill:none;stroke-width:1.8;stroke-linecap:round}
.user-btn.active{background:var(--accent);border-color:var(--accent-dk)}
.user-btn.active svg{stroke:#fff}

#hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#2d1e0c,#8b5e2e)}
#hero-img{width:100%;height:200px;object-fit:cover;opacity:0;transition:opacity .4s}
#hero-img.loaded{opacity:1}
#hero-ph{
  height:200px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#2d1e0c 0%,#7a5128 60%,#b8863a 100%);
}
#hero-ph svg{width:56px;height:56px;stroke:rgba(255,255,255,.2);fill:none;stroke-width:1.2;stroke-linecap:round}
.hero-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72) 0%,transparent 55%);pointer-events:none}
.hero-text{position:absolute;bottom:0;left:0;right:0;padding:20px 18px}
.hero-name{font-family:var(--serif);font-size:26px;font-weight:700;color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,.5);line-height:1.2;display:none}
.hero-tag{font-size:12px;color:rgba(255,255,255,.65);margin-top:4px;display:none}

#cat-nav{
  position:sticky;top:var(--nav-h);z-index:100;
  background:var(--surface);border-bottom:1px solid var(--border);
}
#cat-scroll{display:flex;overflow-x:auto;padding:0 12px;scrollbar-width:none;gap:0}
#cat-scroll::-webkit-scrollbar{display:none}
.cat-chip{
  flex-shrink:0;padding:0 16px;height:var(--cat-h);
  font-size:13px;font-weight:500;color:var(--dim);
  border-bottom:3px solid transparent;
  white-space:nowrap;transition:.2s;cursor:pointer;
}
.cat-chip:hover{color:var(--text)}
.cat-chip.active{color:var(--accent-dk);border-bottom-color:var(--accent);font-weight:600}

#status-bar{
  margin:10px 14px;padding:9px 14px;border-radius:10px;
  font-size:12px;text-align:center;display:none;
}
#status-bar.offline{background:rgba(184,134,58,.08);border:1px solid rgba(184,134,58,.25);color:var(--accent-dk)}
#status-bar.connecting{background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.25);color:#3b82f6}
#status-bar.live{background:rgba(54,211,153,.08);border:1px solid rgba(54,211,153,.25);color:#059669}

#content{max-width:680px;margin:0 auto;padding:0 14px}
#loading{text-align:center;padding:60px 20px;color:var(--muted)}
#loading .spin{font-size:32px;margin-bottom:12px;animation:spin 1.4s linear infinite;display:inline-block}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.cat-section{padding:22px 0 6px}
.cat-heading{font-family:var(--serif);font-size:21px;font-weight:600;scroll-margin-top:116px}
.cat-count{font-size:11.5px;color:var(--muted);margin:3px 0 14px}
.cat-divider{height:1px;background:var(--border);margin:6px 0 20px}

.prod-card{
  display:flex;gap:14px;align-items:flex-start;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px;margin-bottom:9px;cursor:pointer;
  transition:.2s;position:relative;overflow:hidden;
}
.prod-card::after{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent);transform:scaleY(0);transition:.2s;transform-origin:center;
}
.prod-card:hover{border-color:rgba(184,134,58,.3);box-shadow:0 3px 14px rgba(0,0,0,.06)}
.prod-card:hover::after{transform:scaleY(1)}
.prod-img{width:76px;height:76px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--bg)}
.prod-ph{width:76px;height:76px;border-radius:9px;background:var(--bg);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:28px}
.prod-info{flex:1;min-width:0}
.prod-name{font-size:14.5px;font-weight:600;line-height:1.3;margin-bottom:3px}
.prod-desc{font-size:12px;color:var(--dim);line-height:1.5;margin-bottom:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-price{font-size:15px;font-weight:700;color:var(--accent-dk)}
.prod-right{flex-shrink:0;display:flex;align-items:center}
.add-btn{
  width:33px;height:33px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 8px rgba(184,134,58,.3);transition:.18s;
}
.add-btn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round}
.add-btn:hover{background:var(--accent-dk);transform:scale(1.07)}
.qty-ctrl{display:flex;align-items:center;gap:1px}
.qty-btn{width:29px;height:29px;border-radius:50%;background:var(--bg);border:1px solid var(--border);
  font-size:17px;display:flex;align-items:center;justify-content:center;color:var(--text);transition:.14s}
.qty-btn:hover{background:var(--accent-lt);border-color:var(--accent)}
.qty-num{width:28px;text-align:center;font-size:14px;font-weight:700;color:var(--accent-dk)}

#cart-fab{
  position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%) translateY(30px);
  background:var(--accent-dk);color:#fff;
  padding:14px 26px;border-radius:50px;font-size:14px;font-weight:700;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 6px 24px rgba(140,100,32,.38);
  transition:.3s cubic-bezier(.34,1.56,.64,1);
  z-index:300;opacity:0;pointer-events:none;cursor:pointer;
}
#cart-fab.show{opacity:1;pointer-events:all;transform:translateX(-50%) translateY(0)}
#cart-fab svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
#cart-count{background:#fff;color:var(--accent-dk);width:22px;height:22px;border-radius:50%;
  font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;}

.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;opacity:0;pointer-events:none;transition:.25s}
.drawer-bg.open{opacity:1;pointer-events:all}
.drawer{
  position:fixed;bottom:0;left:0;right:0;z-index:401;
  background:var(--surface);border-radius:22px 22px 0 0;
  max-height:88dvh;overflow-y:auto;
  transform:translateY(100%);transition:.3s cubic-bezier(.34,1.2,.64,1);
  padding-bottom:env(safe-area-inset-bottom);
}
.drawer-bg.open .drawer{transform:translateY(0)}
.drawer-pill{width:40px;height:4px;background:var(--border);border-radius:2px;margin:14px auto 0}
.drawer-title{font-family:var(--serif);font-size:20px;font-weight:600;padding:14px 20px;border-bottom:1px solid var(--border)}
.drawer-body{padding:16px 20px}

.cart-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
.cart-row:last-child{border-bottom:none}
.cart-name{flex:1;font-size:13.5px;font-weight:600}
.cart-sub{font-size:11.5px;color:var(--dim);margin-top:2px}
.total-row{display:flex;justify-content:space-between;align-items:center;
  padding:14px 0 0;border-top:2px solid var(--border);margin-top:4px;font-size:16px;font-weight:800}
.total-row span:last-child{color:var(--accent-dk)}
.email-prompt{padding-top:14px;border-top:1px dashed var(--border);margin-top:12px;display:none}
.ep-label{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:7px}
.ep-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;
  font-size:13.5px;font-family:var(--sans);outline:none;background:var(--bg);transition:.18s}
.ep-input:focus{border-color:var(--accent)}
.ep-row{display:flex;gap:7px;margin-top:8px}
.ep-skip{flex:1;padding:11px;background:var(--bg);border:1px solid var(--border);
  border-radius:10px;font-size:12.5px;font-family:var(--sans);color:var(--dim);cursor:pointer}
.ep-ok{flex:2;padding:11px;background:var(--accent-dk);border:none;border-radius:10px;
  font-size:13px;font-weight:700;color:#fff;font-family:var(--sans);cursor:pointer}
.checkout-btn{
  width:100%;padding:14px;background:var(--accent-dk);color:#fff;border:none;
  border-radius:12px;font-size:15px;font-weight:700;font-family:var(--sans);
  margin-top:14px;cursor:pointer;transition:.18s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.checkout-btn:hover{background:var(--accent)}
.checkout-btn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round}
#cart-empty-msg{text-align:center;padding:30px;color:var(--muted);display:none}

.auth-tabs{display:flex;gap:3px;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:16px}
.auth-tab{flex:1;padding:9px;border-radius:7px;font-size:13px;font-weight:500;
  color:var(--dim);cursor:pointer;transition:.16s;text-align:center}
.auth-tab.active{background:var(--surface);color:var(--text);font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.1)}
.auth-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;
  font-size:13.5px;font-family:var(--sans);outline:none;background:var(--bg);
  color:var(--text);transition:.18s;margin-bottom:9px}
.auth-input:focus{border-color:var(--accent)}
.auth-submit{width:100%;padding:13px;background:var(--accent-dk);color:#fff;border:none;
  border-radius:11px;font-size:14px;font-weight:700;font-family:var(--sans);cursor:pointer;transition:.18s}
.auth-submit:hover{background:var(--accent)}
.auth-msg{font-size:12px;padding:7px 11px;border-radius:8px;margin-bottom:10px;display:none}
.auth-msg.err{background:#fff0f0;color:#c53030;border:1px solid #feb2b2}
.auth-msg.ok{background:#f0fff4;color:#276749;border:1px solid #9ae6b4}
.logged-header{display:flex;align-items:center;justify-content:space-between;
  padding:8px 0 14px;border-bottom:1px solid var(--border);margin-bottom:14px}
.logged-name{font-size:15px;font-weight:700}
.logged-email{font-size:11.5px;color:var(--dim);margin-top:2px}
.logout-btn{padding:7px 14px;border:1px solid var(--border);border-radius:8px;
  font-size:12.5px;color:var(--dim);cursor:pointer;font-family:var(--sans)}

#success-ov{
  position:fixed;inset:0;background:rgba(250,248,243,.97);z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:32px;opacity:0;pointer-events:none;transition:.3s;
}
#success-ov.show{opacity:1;pointer-events:all}
.success-icon{font-size:66px;animation:pop .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.success-title{font-family:var(--serif);font-size:26px;font-weight:700}
.success-sub{font-size:14px;color:var(--dim);max-width:300px;line-height:1.6}
.back-btn{margin-top:10px;padding:13px 30px;background:var(--accent-dk);color:#fff;border:none;
  border-radius:12px;font-size:14px;font-weight:700;font-family:var(--sans);cursor:pointer}

#toast{
  position:fixed;bottom:calc(106px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%);background:rgba(26,18,9,.88);color:#fff;
  padding:9px 20px;border-radius:28px;font-size:12.5px;font-weight:600;
  z-index:9999;opacity:0;transition:.24s;white-space:nowrap;pointer-events:none;
}
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">
    <div class="brand-name" id="brand-name">Loading…</div>
    <div class="brand-tag" id="brand-tag"></div>
  </div>
  <div class="table-badge" id="table-badge">Table —</div>
  <button class="user-btn" id="user-btn" onclick="openAuth()" title="Account">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
  </button>
</div>

<div id="hero">
  <div id="hero-ph">
    <svg viewBox="0 0 24 24"><line x1="12" y1="2" x2="12" y2="22"/><path d="M5 2v7a4 4 0 0 0 8 0V2"/><line x1="19" y1="2" x2="19" y2="22"/></svg>
  </div>
  <img id="hero-img" src="" alt="" onload="this.classList.add('loaded')"/>
  <div class="hero-grad"></div>
  <div class="hero-text">
    <div class="hero-name" id="hero-name"></div>
    <div class="hero-tag" id="hero-tag-ov"></div>
  </div>
</div>

<div id="status-bar"></div>

<div id="cat-nav"><div id="cat-scroll"></div></div>

<div id="content">
  <div id="loading"><div class="spin">⟳</div><div>Connecting to server…</div></div>
  <div id="menu-sections"></div>
</div>

<button id="cart-fab" onclick="openCart()">
  <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
  <span id="fab-label">View Order</span>
  <span id="cart-count">0</span>
</button>

<!-- CART DRAWER -->
<div class="drawer-bg" id="cart-bg" onclick="closeBg(event,'cart-bg')">
  <div class="drawer" onclick="event.stopPropagation()">
    <div class="drawer-pill"></div>
    <div class="drawer-title">🛒 Your Order</div>
    <div class="drawer-body">
      <div id="cart-empty-msg"><div style="font-size:36px;margin-bottom:9px">🍽</div><div>Nothing added yet</div></div>
      <div id="cart-list"></div>
      <div id="cart-summary" style="display:none">
        <div class="total-row"><span>Total</span><span id="cart-total">$0.00</span></div>
        <div class="email-prompt" id="email-prompt">
          <div class="ep-label">Add email for updates (optional)</div>
          <input class="ep-input" id="ep-email" type="email" placeholder="your@email.com"/>
          <div class="ep-row">
            <button class="ep-skip" onclick="placeOrder(null)">Skip</button>
            <button class="ep-ok" onclick="placeWithEmail()">Confirm & Order →</button>
          </div>
        </div>
        <button class="checkout-btn" id="checkout-btn" onclick="startCheckout()">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          Place Order
        </button>
      </div>
    </div>
  </div>
</div>

<!-- AUTH DRAWER -->
<div class="drawer-bg" id="auth-bg" onclick="closeBg(event,'auth-bg')">
  <div class="drawer" onclick="event.stopPropagation()">
    <div class="drawer-pill"></div>
    <div class="drawer-title">Account</div>
    <div class="drawer-body">
      <div id="logged-view" style="display:none">
        <div class="logged-header">
          <div>
            <div class="logged-name" id="logged-name">Hi there!</div>
            <div class="logged-email" id="logged-email"></div>
          </div>
          <button class="logout-btn" onclick="logout()">Log out</button>
        </div>
        <div style="font-size:13px;color:var(--dim);line-height:1.6">Your visits and orders are tracked. Thank you!</div>
      </div>
      <div id="auth-forms">
        <div class="auth-tabs">
          <div class="auth-tab active" id="tab-in" onclick="authTab('in')">Sign In</div>
          <div class="auth-tab" id="tab-up" onclick="authTab('up')">Create Account</div>
        </div>
        <div class="auth-msg" id="auth-err"></div>
        <div class="auth-msg ok" id="auth-ok"></div>
        <div id="form-in">
          <input class="auth-input" id="in-email" type="email" placeholder="Email"/>
          <input class="auth-input" id="in-pass" type="password" placeholder="Password"/>
          <button class="auth-submit" onclick="doLogin()">Sign In</button>
        </div>
        <div id="form-up" style="display:none">
          <input class="auth-input" id="up-name" placeholder="Your name"/>
          <input class="auth-input" id="up-email" type="email" placeholder="Email"/>
          <input class="auth-input" id="up-pass" type="password" placeholder="Password (min 6 chars)"/>
          <button class="auth-submit" onclick="doRegister()">Create Account</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SUCCESS -->
<div id="success-ov">
  <div class="success-icon">✅</div>
  <div class="success-title">Order Sent!</div>
  <div class="success-sub" id="success-msg">Your order is being prepared. Please wait at your table.</div>
  <button class="back-btn" onclick="document.getElementById('success-ov').classList.remove('show')">← Back to Menu</button>
</div>

<div id="toast"></div>

<!-- ══════════════════════════════════════════════════
     BRIDGE SCRIPT
     Connects this page (hosted on GitHub Pages) to
     the Python server running on your PC.
     Change SERVER to your WiFi IP or Cloudflare URL.
     ══════════════════════════════════════════════════ -->
<script>
(function(){
  // ▼▼▼ CHANGE THIS to your PC's IP or Cloudflare URL ▼▼▼
  var SERVER = 'http://192.168.100.77:5000';
  // ▲▲▲ e.g. 'https://abc-xyz.trycloudflare.com'    ▲▲▲

  // Expose server URL for the menu JS below
  window.OMORA_SERVER = SERVER;

  // SSE — live product/settings updates from dashboard
  try {
    var es = new EventSource(SERVER + '/events/menu');
    es.addEventListener('products', function(e) {
      try {
        var prods = JSON.parse(e.data);
        window._menuProducts = prods;
        if (window._onBridgeProducts) window._onBridgeProducts(prods);
      } catch(err) {}
    });
    es.addEventListener('settings', function(e) {
      try {
        var s = JSON.parse(e.data);
        window._menuSettings = s;
        if (window._onBridgeSettings) window._onBridgeSettings(s);
      } catch(err) {}
    });
    es.onerror = function() {
      // SSE failed — mark as bridge-only mode
      window._bridgeSseError = true;
    };
  } catch(err) {}

  // MenuBridge API — used by menu JS when direct fetch fails
  window.MenuBridge = {
    sendOrder: function(tableId, items, email, name) {
      fetch(SERVER + '/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tableId: tableId, items: items, customerEmail: email || null, customerName: name || null })
      }).catch(function(){});
    },
    logVisit: function(tableId, email, name) {
      fetch(SERVER + '/api/visit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tableId: tableId, customerEmail: email || null, customerName: name || null })
      }).catch(function(){});
    },
    register: function(email, password, name, cb) {
      fetch(SERVER + '/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password, name: name })
      }).then(function(r){ return r.json(); }).then(cb).catch(function(e){ cb({ error: e.message }); });
    },
    login: function(email, password, cb) {
      fetch(SERVER + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      }).then(function(r){ return r.json(); }).then(cb).catch(function(e){ cb({ error: e.message }); });
    }
  };

  // Log visit on load if table param is present
  var params = new URLSearchParams(location.search);
  if (params.get('table')) {
    var u = JSON.parse(localStorage.getItem('omora_user') || 'null');
    window.MenuBridge.logVisit(params.get('table'), u && u.email, u && u.name);
  }
})();
</script>

<!-- ══════════════════════════════════════════════════
     MENU APP SCRIPT
     ══════════════════════════════════════════════════ -->
<script>
// SERVER is set by bridge above (window.OMORA_SERVER)
// No detectServer() gymnastics needed — bridge always sets it
const SERVER  = window.OMORA_SERVER || 'http://localhost:5000';
const TABLE_ID = new URLSearchParams(location.search).get('table') || '1';

let products  = [];
let settings  = {};
let cart      = {};
let user      = JSON.parse(localStorage.getItem('omora_user') || 'null');
let connected = false;

function setStatus(type, msg) {
  const el = document.getElementById('status-bar');
  if (!msg) { el.style.display = 'none'; return; }
  el.className = type;
  el.textContent = msg;
  el.style.display = 'block';
}

async function init() {
  document.getElementById('table-badge').textContent = 'Table ' + TABLE_ID;
  renderUser();
  setStatus('connecting', '⟳ Connecting to server…');
  await loadData();
  logVisit();
}

async function loadData() {
  try {
    const [sRes, pRes] = await Promise.all([
      fetch(SERVER + '/api/settings', { signal: AbortSignal.timeout(6000) }),
      fetch(SERVER + '/api/products', { signal: AbortSignal.timeout(6000) }),
    ]);
    if (!sRes.ok || !pRes.ok) throw new Error('bad response');
    settings  = await sRes.json();
    const pd  = await pRes.json();
    products  = (pd.products || []).filter(p => p.available !== false);
    connected = true;
    localStorage.setItem('omora_products', JSON.stringify(products));
    localStorage.setItem('omora_settings', JSON.stringify(settings));
    applySettings();
    renderMenu();
    setStatus('live', '● Live — ' + (settings.restaurantName || 'Menu'));
    setTimeout(() => setStatus(null), 3000);
    connectSSE();
  } catch(err) {
    // Try localStorage cache first
    const cachedP = localStorage.getItem('omora_products');
    const cachedS = localStorage.getItem('omora_settings');
    if (cachedP) {
      products = JSON.parse(cachedP).filter(p => p.available !== false);
      if (cachedS) settings = JSON.parse(cachedS);
      applySettings();
      renderMenu();
      setStatus('offline', '⚠ Using cached menu — server unreachable');
    } else if (window._menuProducts) {
      // Bridge already pushed data via SSE
      products = window._menuProducts.filter(p => p.available !== false);
      if (window._menuSettings) settings = window._menuSettings;
      applySettings();
      renderMenu();
      setStatus('offline', '⚠ Using bridge data — direct connection failed');
    } else {
      document.getElementById('loading').innerHTML =
        `<div style="padding:40px;text-align:center;color:#888;font-size:13px">
          Could not reach server at<br><strong>${SERVER}</strong><br><br>
          Make sure your PC server is running<br>and the IP is correct in the bridge script.
        </div>`;
      setStatus('offline', '✗ Server unreachable — check IP in bridge script');
    }
  }
}

function applySettings() {
  const name = settings.restaurantName || 'Our Menu';
  document.title = name + ' — Menu';
  document.getElementById('brand-name').textContent = name;
  document.getElementById('brand-tag').textContent  = settings.tagline || '';
  document.getElementById('hero-name').textContent  = name;
  document.getElementById('hero-tag-ov').textContent = settings.tagline || '';
  if (name) document.getElementById('hero-name').style.display = 'block';
  if (settings.tagline) document.getElementById('hero-tag-ov').style.display = 'block';
  if (settings.banner) {
    document.getElementById('hero-img').src = settings.banner;
    document.getElementById('hero-ph').style.display = 'none';
  }
}

function connectSSE() {
  // Register handlers so bridge SSE events update the live menu
  window._onBridgeProducts = all => {
    products = all.filter(p => p.available !== false);
    localStorage.setItem('omora_products', JSON.stringify(products));
    renderMenu();
  };
  window._onBridgeSettings = s => {
    settings = { ...settings, ...s };
    localStorage.setItem('omora_settings', JSON.stringify(settings));
    applySettings();
  };
}

function logVisit() {
  const body = { tableId: TABLE_ID, customerEmail: user?.email || null, customerName: user?.name || null };
  if (connected) {
    fetch(SERVER + '/api/visit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).catch(() => {});
  } else if (window.MenuBridge) {
    window.MenuBridge.logVisit(TABLE_ID, body.customerEmail, body.customerName);
  }
}

/* ── RENDER ──────────────────────────────────────── */
function renderMenu() {
  document.getElementById('loading').style.display = 'none';
  const cats = [...new Set(products.map(p => p.category || 'Other'))];
  document.getElementById('cat-scroll').innerHTML = cats.map((c, i) =>
    `<div class="cat-chip${i===0?' active':''}" onclick="jumpCat('${esc(c)}',this)">${c}</div>`
  ).join('');
  document.getElementById('menu-sections').innerHTML = cats.map(c => {
    const items = products.filter(p => (p.category || 'Other') === c);
    if (!items.length) return '';
    return `<div class="cat-section" id="cat-${esc(c)}" data-cat="${c}">
      <div class="cat-heading">${c}</div>
      <div class="cat-count">${items.length} item${items.length!==1?'s':''}</div>
      ${items.map(p => cardHTML(p)).join('')}
      <div class="cat-divider"></div>
    </div>`;
  }).join('');
  attachObserver();
  renderCart();
}

function esc(s) { return CSS.escape(s.replace(/['"]/g,'')); }

function cardHTML(p) {
  const qty = cart[p.id] || 0;
  return `<div class="prod-card" onclick="handleCardClick('${p.id}',event)">
    ${p.image ? `<img class="prod-img" src="${p.image}" alt="${p.name}" loading="lazy">` : `<div class="prod-ph">🍽</div>`}
    <div class="prod-info">
      <div class="prod-name">${p.name}</div>
      ${p.description ? `<div class="prod-desc">${p.description}</div>` : ''}
      <div class="prod-price">$${parseFloat(p.price||0).toFixed(2)}</div>
    </div>
    <div class="prod-right">
      ${qty
        ? `<div class="qty-ctrl" onclick="event.stopPropagation()">
             <button class="qty-btn" onclick="setQty('${p.id}',-1)">−</button>
             <div class="qty-num">${qty}</div>
             <button class="qty-btn" onclick="setQty('${p.id}',+1)">+</button>
           </div>`
        : `<button class="add-btn" onclick="event.stopPropagation();addItem('${p.id}')">
             <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
           </button>`}
    </div>
  </div>`;
}

function handleCardClick(id) { if (!cart[id]) addItem(id); }

function attachObserver() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        const c = en.target.dataset.cat;
        document.querySelectorAll('.cat-chip').forEach(ch => ch.classList.toggle('active', ch.textContent === c));
      }
    });
  }, { rootMargin: '-68px 0px -55% 0px', threshold: 0 });
  document.querySelectorAll('.cat-section').forEach(el => obs.observe(el));
}

function jumpCat(id, btn) {
  document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const el = document.getElementById('cat-' + id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ── CART ─────────────────────────────────────────── */
function addItem(id) {
  cart[id] = (cart[id] || 0) + 1;
  const p = products.find(x => x.id === id);
  renderMenu(); renderCart();
  toast((p?.name || 'Item') + ' added');
  document.getElementById('cart-fab').classList.add('show');
}

function setQty(id, delta) {
  cart[id] = (cart[id] || 0) + delta;
  if (cart[id] <= 0) delete cart[id];
  renderMenu(); renderCart();
  if (!Object.keys(cart).length) document.getElementById('cart-fab').classList.remove('show');
}

function renderCart() {
  const ids = Object.keys(cart);
  document.getElementById('cart-count').textContent = ids.reduce((s,k) => s+cart[k], 0);
  const listEl    = document.getElementById('cart-list');
  const summaryEl = document.getElementById('cart-summary');
  const emptyEl   = document.getElementById('cart-empty-msg');
  if (!ids.length) { emptyEl.style.display='block'; summaryEl.style.display='none'; listEl.innerHTML=''; return; }
  emptyEl.style.display = 'none'; summaryEl.style.display = 'block';
  let total = 0;
  listEl.innerHTML = ids.map(id => {
    const p = products.find(x => x.id === id); if (!p) return '';
    const sub = parseFloat(p.price||0) * cart[id]; total += sub;
    return `<div class="cart-row">
      <div style="flex:1"><div class="cart-name">${p.name}</div>
      <div class="cart-sub">$${parseFloat(p.price||0).toFixed(2)} × ${cart[id]} = $${sub.toFixed(2)}</div></div>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="setQty('${id}',-1)">−</button>
        <div class="qty-num">${cart[id]}</div>
        <button class="qty-btn" onclick="setQty('${id}',+1)">+</button>
      </div></div>`;
  }).join('');
  document.getElementById('cart-total').textContent = '$' + total.toFixed(2);
}

function openCart() { renderCart(); document.getElementById('cart-bg').classList.add('open'); }
function closeBg(e, id) { if (e.target === document.getElementById(id)) document.getElementById(id).classList.remove('open'); }

/* ── ORDER ─────────────────────────────────────────── */
function startCheckout() {
  if (user) { placeOrder(user.email, user.name); return; }
  document.getElementById('email-prompt').style.display = 'block';
  document.getElementById('checkout-btn').style.display = 'none';
}

function placeWithEmail() {
  const email = document.getElementById('ep-email').value.trim();
  if (email && !email.includes('@')) { toast('Enter a valid email'); return; }
  placeOrder(email || null);
}

async function placeOrder(email, name) {
  const items = Object.keys(cart).map(id => {
    const p = products.find(x => x.id === id);
    return p ? { ...p, quantity: cart[id] } : null;
  }).filter(Boolean);
  if (!items.length) return;
  const body = { tableId: TABLE_ID, items, customerEmail: email || null, customerName: name || null };
  try {
    if (connected) {
      await fetch(SERVER + '/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    } else {
      window.MenuBridge.sendOrder(TABLE_ID, items, email, name);
    }
  } catch { window.MenuBridge && window.MenuBridge.sendOrder(TABLE_ID, items, email, name); }
  cart = {};
  renderMenu(); renderCart();
  document.getElementById('cart-bg').classList.remove('open');
  document.getElementById('cart-fab').classList.remove('show');
  document.getElementById('email-prompt').style.display = 'none';
  document.getElementById('checkout-btn').style.display = 'flex';
  document.getElementById('success-msg').textContent = email
    ? `Order sent! We'll update you at ${email}.`
    : 'Your order is being prepared. Please wait at your table.';
  document.getElementById('success-ov').classList.add('show');
}

/* ── AUTH ─────────────────────────────────────────── */
function openAuth() { document.getElementById('auth-bg').classList.add('open'); }

function renderUser() {
  document.getElementById('user-btn').classList.toggle('active', !!user);
  document.getElementById('logged-view').style.display = user ? '' : 'none';
  document.getElementById('auth-forms').style.display  = user ? 'none' : '';
  if (user) {
    document.getElementById('logged-name').textContent  = 'Hi, ' + (user.name || 'there') + '!';
    document.getElementById('logged-email').textContent = user.email;
  }
}

function authTab(t) {
  document.getElementById('tab-in').classList.toggle('active', t==='in');
  document.getElementById('tab-up').classList.toggle('active', t==='up');
  document.getElementById('form-in').style.display = t==='in' ? '' : 'none';
  document.getElementById('form-up').style.display = t==='up' ? '' : 'none';
  document.getElementById('auth-err').style.display = 'none';
  document.getElementById('auth-ok').style.display  = 'none';
}

function showAuthErr(m) {
  const el = document.getElementById('auth-err');
  el.textContent = m; el.className = 'auth-msg err'; el.style.display = 'block';
  document.getElementById('auth-ok').style.display = 'none';
}
function showAuthOk(m) {
  const el = document.getElementById('auth-ok');
  el.textContent = m; el.style.display = 'block';
  document.getElementById('auth-err').style.display = 'none';
}

async function doLogin() {
  const email = document.getElementById('in-email').value.trim().toLowerCase();
  const pass  = document.getElementById('in-pass').value;
  if (!email || !pass) { showAuthErr('Fill in all fields'); return; }
  try {
    const cb = d => {
      if (d.error) { showAuthErr(d.error); return; }
      user = d.user; localStorage.setItem('omora_user', JSON.stringify(user));
      renderUser(); showAuthOk('Welcome back, ' + (user.name || user.email) + '!');
      setTimeout(() => document.getElementById('auth-bg').classList.remove('open'), 1200);
      logVisit();
    };
    if (connected) {
      const r = await fetch(SERVER + '/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: pass }) });
      cb(await r.json());
    } else {
      window.MenuBridge.login(email, pass, cb);
    }
  } catch { showAuthErr('Cannot reach server'); }
}

async function doRegister() {
  const name  = document.getElementById('up-name').value.trim();
  const email = document.getElementById('up-email').value.trim().toLowerCase();
  const pass  = document.getElementById('up-pass').value;
  if (!email || !pass) { showAuthErr('Email and password required'); return; }
  if (pass.length < 6) { showAuthErr('Password must be at least 6 characters'); return; }
  try {
    const cb = d => {
      if (d.error) { showAuthErr(d.error); return; }
      user = d.user; localStorage.setItem('omora_user', JSON.stringify(user));
      renderUser(); showAuthOk('Account created! Welcome, ' + (user.name || user.email) + '!');
      setTimeout(() => document.getElementById('auth-bg').classList.remove('open'), 1200);
      logVisit();
    };
    if (connected) {
      const r = await fetch(SERVER + '/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, password: pass }) });
      cb(await r.json());
    } else {
      window.MenuBridge.register(email, pass, name, cb);
    }
  } catch { showAuthErr('Cannot reach server'); }
}

function logout() {
  user = null; localStorage.removeItem('omora_user');
  renderUser(); toast('Logged out');
  document.getElementById('auth-bg').classList.remove('open');
}

let _tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.opacity = '1';
  clearTimeout(_tt); _tt = setTimeout(() => { el.style.opacity = '0'; }, 2200);
}

init();
</script>
</body>
